name: Verificación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
      - run: node --check src/main/resources/static/academia.js

  tests-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: academia_test
          POSTGRES_USER: academia
          POSTGRES_PASSWORD: academia-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academia -d academia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/academia_test
      TEST_DATABASE_USER: academia
      TEST_DATABASE_PASSWORD: academia-ci-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify

  despliegue:
    needs: [tests-h2, tests-postgresql]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: academia-ci-test
      APP_ADMIN_EMAIL: admin@academia.test
      APP_ADMIN_PASSWORD: academia-ci-setup
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: |
          curl --fail --show-error --silent http://127.0.0.1:8080/actuator/health/readiness
          curl --fail --show-error --silent --location --max-time 15 http://127.0.0.1:8080/ -o /tmp/academia-login.html
          grep -q 'Inicia sesión' /tmp/academia-login.html
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
