<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión Académica</title>
    <link rel="stylesheet" href="/academia.css">
    <script src="/academia.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <a class="brand" href="#inicio">
                <span class="brand-mark" aria-hidden="true">A</span>
                <span>Gestión<br>Académica</span>
            </a>
            <nav id="navigation" aria-label="Módulos"></nav>
        </aside>
        <div class="app-main">
            <header class="topbar">
                <button class="secondary menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar"
                        aria-expanded="false">Menú</button>
                <a class="user-link" href="#cuenta" id="identity">Mi cuenta</a>
                <form th:action="@{/logout}" method="post">
                    <button class="secondary" type="submit">Cerrar sesión</button>
                </form>
            </header>
            <main id="contenido" tabindex="-1" aria-busy="true">
                <p class="notice">Cargando la aplicación…</p>
            </main>
            <noscript>Activa JavaScript en el navegador para usar la aplicación.</noscript>
        </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="notification" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
