spring.application.name=academia
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/academia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.threads.virtual.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.resources.cache.cachecontrol.no-cache=true
server.address=${APP_BIND:127.0.0.1}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_SECURE_COOKIE:false}
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
academia.admin.email=${APP_ADMIN_EMAIL:}
academia.admin.password=${APP_ADMIN_PASSWORD:}
academia.zone=${APP_TIME_ZONE:America/Lima}
